
[package]
authors = ["João Pedro Miranda C. Hluchan <berrytern@gmail.com>"]
edition = "2024"
name    = "amqp_rs"
version = "0.2.0"

[lib]
crate-type = ["cdylib"]

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[dependencies]
# Link to your local core crate!
amqp-rs-core = { path = "../../core" }

# Node-specific dependencies
amqp-client-rust = { version = "0.2.0", features = [
  "tls",
  "zstd",
  "lz4_flex",
  "flate2",
] }
futures = "0.3"
mimalloc = { version = "0.1", default-features = false, features = ["local_dynamic_tls"], optional = true }
napi = { version = "3.0.0", features = ["napi4", "async", "tokio_rt"] }
napi-derive = "3.0.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }


[build-dependencies]
napi-build = "2"
