[package]
name = "amqp-rs"
version = "0.1.3"
edition = "2024"

[lib]
name = "amqp_rs"
crate-type = ["cdylib"]

[dependencies]
# Link to your local core crate!
amqp-rs-core = { path = "../../core" }

# Python-specific dependencies
amqp-client-rust = { version = "=0.0.7", features = ["tls", "zstd", "lz4_flex", "flate2"] }
pyo3 = { version = "0.29.2", features = ["extension-module", "generate-import-lib"] }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
