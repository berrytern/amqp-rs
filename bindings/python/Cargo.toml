[package]
name = "amqp-rs"
version = "0.1.2"
edition = "2024"

[lib]
name = "amqp_rs"
crate-type = ["cdylib"]

[dependencies]
# Link to your local core crate!
amqp-rs-core = { path = "../../core" }

# Python-specific dependencies
amqp-client-rust = { version = "=0.0.7-alpha.4", features = ["tls", "zstd", "lz4_flex", "flate2"] }
pyo3 = { version = "0.28", features = ["extension-module", "generate-import-lib"] }
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3